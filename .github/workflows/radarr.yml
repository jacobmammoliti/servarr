name: Build and Publish Radarr Container Image
on:
  push:
    branches:
      - main
    paths: # Only trigger on changes to Radarr source, excluding Helm chart changes
      - radarr/**
      - '!radarr/helm/**'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: radarr
  RADARR_VERSION: "6.0.4.10291"
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
      
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./radarr
          push: true
          file: ./radarr/Dockerfile
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.RADARR_VERSION }}
      
      - name: Attest container image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      
      - name: Sign container image
        run: cosign sign ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}